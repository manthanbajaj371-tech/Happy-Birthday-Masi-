<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Dear A.A.Y.A (Anshu Masi)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 15px;
    }
    h1 {
      font-size: 2.2rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      color: #fff;
      animation: pulse 2s infinite alternate;
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #ffeaa7;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }
    .marquee-box {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin: 20px 0;
      padding: 15px 0;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      position: relative;
    }
    .marquee-box::before,
    .marquee-box::after {
      content: "";
      position: absolute;
      top: 0;
      width: 60px;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .marquee-box::before {
      left: 0;
      background: linear-gradient(to right, rgba(255, 117, 140, 0.9), transparent);
    }
    .marquee-box::after {
      right: 0;
      background: linear-gradient(to left, rgba(255, 117, 140, 0.9), transparent);
    }
    .marquee-track {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      width: max-content;
      animation: scrollLeft 30s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .marquee-track img {
      height: 250px;
      width: auto;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      border: 3px solid #fff;
      object-fit: cover;
      transition: transform 0.3s;
      flex-shrink: 0;
    }
    .marquee-track img:hover {
      transform: scale(1.05);
    }
    @keyframes scrollLeft {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .audio-section {
      margin: 25px 0;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 15px;
    }
    .audio-section p {
      margin-bottom: 10px;
      font-size: 1rem;
    }
    audio {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      outline: none;
      border-radius: 30px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .play-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #ff5d7f;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
    .message-card {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
  </style>
</head>

    <div class="audio-section">
      <p>🎵 <b>Birthday Song Suniye:</b></p>
      <audio id="birthdayAudio" controls loop playsinline preload="auto">
        <source src="https://cdn.jsdelivr.net/gh/manthanbajaj371-tech/Happy-Birthday-Masi-@main/Free%20Download%20Kid%20Songs%20Mp3%20Audio%20Hindi.mp3" type="audio/mpeg">

      </audio>
      <button class="play-btn" id="playAudioBtn" type="button">▶ Play Birthday Song</button>
    </div>

      <p>🎂 <b>Wishing you a very Happy Birthday, Anshu Masi!</b> 💖</p>
      <p>Bhagwan kare aapka har din khushiyo se bhara rahe aur aap hamesha muskurati rahein!</p>
    </div>

  <script>
    const audio = document.getElementById('birthdayAudio');
    const playBtn = document.getElementById('playAudioBtn');
    const audioUrl = 'https://cdn.jsdelivr.net/gh/manthanbajaj371-tech/Happy-Birthday-Masi-@main/Free%20Download%20Kid%20Songs%20Mp3%20Audio%20Hindi.mp3';

    const ensureAudioSource = () => {
      if (!audio.src || audio.src !== audioUrl) {
        audio.src = audioUrl;
        audio.load();
      }
    };

    const tryPlayAudio = async () => {
      ensureAudioSource();

      try {
        await audio.play();
        playBtn.textContent = '♫ Playing...';
      } catch (error) {
        console.warn('Audio could not start automatically:', error);
        playBtn.textContent = '▶ Play Birthday Song';
      }
    };

    playBtn.addEventListener('click', tryPlayAudio);

    audio.addEventListener('error', () => {
      playBtn.textContent = '⚠ Audio load failed';
      console.error('Audio file failed to load.');
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶ Play Birthday Song';
    });

    document.addEventListener('click', () => {
      if (audio.paused) {
        ensureAudioSource();
      }
    }, { once: true });
  </script>
