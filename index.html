<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Dear A.A.Y.A (Anshu Masi)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 15px;
    }
    h1 {
      font-size: 2.2rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      color: #fff;
      animation: pulse 2s infinite alternate;
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #ffeaa7;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }
    .marquee-box {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin: 20px 0;
      padding: 15px 0;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
    }
    .marquee-track {
      display: inline-flex;
      gap: 20px;
      animation: scrollLeft 18s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .marquee-track img {
      height: 250px;
      width: auto;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      border: 3px solid #fff;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .marquee-track img:hover {
      transform: scale(1.05);
    }
    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .audio-section {
      margin: 25px 0;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 15px;
    }
    audio {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      outline: none;
      border-radius: 30px;
    }
    .message-card {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 Happy Birthday Dear A. A. Y . A 🎉</h1>
    <h2>✨ (Pyari Anshu Masi) ✨</h2>

    <!-- Photo Marquee Section -->
    <div class="marquee-box">
      <div class="marquee-track">
        <!-- Replace src with your image filenames or URLs -->
        <img src="IMG-20250725-WA0058.jpg" alt="Birthday Photo 1">
        <img src="1700410418319.jpg" alt="Birthday Photo 2">
        <img src="1700410418349.jpg" alt="Birthday Photo 3">
        <img src="1700410418383.jpg" alt="Birthday Photo 4">
        <img src="1700410418535.jpg" alt="Birthday Photo 5">
        <img src=" " alt="Birthday Photo 6">
        <!-- Duplicate for smooth infinite loop -->
        <img src="IMG-20250725-WA0058.jpg" alt="Birthday Photo 1">
        <img src="photo2.jpg" alt="Birthday Photo 2">
        <img src="photo3.jpg" alt="Birthday Photo 3">
        <img src="photo4.jpg" alt="Birthday Photo 4">
        <img src="photo5.jpg" alt="Birthday Photo 5">
        <img src="photo6.jpg" alt="Birthday Photo 6">
      </div>
    </div>

    <!-- Music Player Section -->
    <div class="audio-section">
      <p>🎵 <b>Birthday Song Suniye:</b></p>
      <!-- Replace song.mp3 with your uploaded audio file -->
      <audio controls autoplay loop>
        <source src="song.mp3" type="audio/mpeg">
        Aapka browser audio play nahi kar pa raha hai.
      </audio>
    </div>

    <!-- Greeting Wishes Card -->
    <div class="message-card">
      <p>🎂 <b>Wishing you a very Happy Birthday, Anshu Masi!</b> 💖</p>
      <p>Bhagwan kare aapka har din khushiyo se bhara rahe aur aap hamesha muskurati rahein!</p>
    </div>
  </div>

</body>
</html>
